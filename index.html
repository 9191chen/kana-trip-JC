<style>
:root{
  --snow:#EEF2F4; --paper:#FFFFFF; --ink:#1E2A33; --sub:#6B7780; --line:#D5DDE2;
  --ai:#27466B;      /* 藍 */
  --enji:#A3263A;    /* 臙脂 */
  --kusa:#4E7A3A;    /* 草 */
  --gold:#C9A24A;    /* 金箔 */
  --warn-bg:#FFF6E0; --warn:#8A5A00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--snow);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6}
a{color:var(--ai)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 14px 96px}
.serif{font-family:"Noto Serif TC","Songti TC",serif}

/* 頂部金箔帶 */
.hero{position:relative;margin:0 -14px;padding:22px 18px 18px;color:#fff;
  background:var(--ai);overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10% -40% auto;width:70%;height:140%;
  background:radial-gradient(circle at 30% 30%,#E8CF8A 0,#C9A24A 35%,transparent 70%);opacity:.35;transform:rotate(-12deg)}
.hero h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;letter-spacing:.08em;position:relative;z-index:1}
.hero::before{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;background:linear-gradient(90deg,#9C7A2B,#E9D08C,#B8903A)}
.hero p{margin:4px 0 0;font-size:13px;opacity:.85;position:relative;z-index:1}

/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button[aria-selected=true]{color:var(--enji);font-weight:700;box-shadow:inset 0 3px 0 var(--gold)}
nav.tabs{border-top:2px solid var(--gold)}
section.page{display:none}
section.page.on{display:block}

/* 日期選擇 */
.days{display:flex;gap:8px;overflow-x:auto;padding:10px;margin:14px 0 10px;scrollbar-width:none;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:16px;background:rgba(255,255,255,.5)}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px;font-size:12px;line-height:1.35;color:var(--ink);text-align:center}
.days button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}

.dayhead{display:flex;align-items:flex-end;gap:12px;margin:6px 0 10px}
.dayhead .num{font-family:"Noto Serif TC",serif;font-weight:900;font-size:54px;line-height:.9;
  background:linear-gradient(135deg,#9C7A2B,#E9D08C 45%,#B8903A 70%,#E4C77A);-webkit-background-clip:text;background-clip:text;color:transparent}
.dayhead h2{margin:0;font-size:18px;font-family:"Noto Serif TC",serif}
.dayhead small{display:block;color:var(--sub);font-size:12px;font-family:"Noto Sans TC",sans-serif;font-weight:400}

.map{height:210px;border-color:var(--gold)!important;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;z-index:1}
.mapnote{font-size:11px;color:var(--sub);margin:0 0 14px}
.tiles-muted{filter:grayscale(1) brightness(1.08) contrast(.85);opacity:.75}
.pin{background:var(--enji);color:#fff;border:2px solid #fff;border-radius:50%;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* 時間軸 */
.tl{list-style:none;margin:0;padding:10px 12px;position:relative;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:16px;background:rgba(255,255,255,.5)}
.tl::before{content:"";position:absolute;left:64px;top:20px;bottom:20px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:44px 1fr;gap:0 18px;padding:9px 0;position:relative}
.tl li::before{content:"";position:absolute;left:48px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.tl li.move::before{background:var(--gold)}
.tl li{padding:5px 0}
.tl li::before{top:19px!important}
.tl li>div:nth-child(2){background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 11px}
.tl .t{padding-top:8px!important;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding-top:2px}
.tl .n{font-weight:500}
.tl .n .idx{display:inline-block;min-width:18px;height:18px;border-radius:50%;background:var(--enji);color:#fff;font-size:11px;text-align:center;line-height:18px;margin-right:5px;vertical-align:1px}
.meta{font-size:13px;color:var(--ink);margin-top:2px}
.grey{color:var(--sub);font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{border:1px solid var(--ai);color:var(--ai);background:var(--paper);border-radius:16px;padding:3px 11px;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.solid{background:var(--ai);color:#fff}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 9px;font-size:12px;margin-top:6px}
.red{color:var(--enji);font-weight:700}
.tt{display:none;margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.tt.on{display:block}
.tt table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tt td{padding:3px 4px;border-bottom:1px dashed var(--line)}
.tt tr.pick td{color:var(--enji);font-weight:700}
.tt .cap{font-weight:700;margin-bottom:4px}

/* 通用卡片 */
h3.sec{font-family:"Noto Serif TC",serif;font-size:19px;margin:20px 0 10px;padding-left:10px;border-left:4px solid var(--gold)}
.card{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h4{margin:0 0 4px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:10px}
.flight .big{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.more{display:none;margin-top:8px;padding:8px 10px;background:var(--snow);border-radius:8px;font-size:13px}
.more.on{display:block}
.total{text-align:right;color:var(--sub);font-size:12px;margin:4px 2px 16px}

/* 交通總覽 */
.tday{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.tday{cursor:pointer;border-left:4px solid var(--gold)}
.tday b{font-family:"Noto Serif TC",serif}
.tday ul{margin:6px 0 0;padding-left:18px;font-size:13px}

/* 子分頁 */
.subtabs{display:flex;gap:6px;margin:14px 0 6px}
.subtabs button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 4px;font-size:13px}
.subtabs button[aria-pressed=true]{background:var(--enji);color:#fff;border-color:var(--enji)}

/* 清單 */
.cat{margin:16px 0}
.cat-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;color:var(--ai);margin-bottom:6px}
.cat-h::before{content:"";width:4px;height:17px;background:var(--gold);border-radius:2px}
.cat-h .x{margin-left:auto}
.item{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;transition:box-shadow .15s,background .15s;touch-action:pan-y}
.box{flex:0 0 22px;height:22px;border-radius:5px;border:2px solid #7A858D;background:#fff;color:var(--ai);font-size:15px;font-weight:900;line-height:18px;text-align:center;padding:0}
.item .txt{flex:1;color:#111}
.item.done{background:#E9EDEF;box-shadow:inset 0 2px 5px rgba(0,0,0,.18)}
.item.done .box{border-color:var(--gold)}
.item.done .txt{color:#4A5358;text-decoration:line-through}
.qty{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--sub)}
.qty input{width:40px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;font:inherit;font-size:13px;text-align:center;background:#fff}
.handle{border:0;background:none;color:#9AA4AB;font-size:16px;padding:0 2px;touch-action:none;cursor:grab}
.item.drag{opacity:.85;box-shadow:0 6px 16px rgba(0,0,0,.2);border-color:var(--gold)}
.x{border:0;background:none;color:var(--sub);font-size:16px;padding:0 4px}
.add{display:flex;gap:6px;margin:4px 0 8px}
.add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--paper)}
.plus{border:0;background:var(--ai);color:#fff;border-radius:8px;width:36px;font-size:20px;line-height:1}
.addcat input{border:2px solid var(--gold)}
.addcat .plus{background:#fff;border:2px solid var(--gold);color:#D4A017;font-weight:900}

/* 購物 */
.svgwrap{overflow-x:auto}
.food li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function ttHTML(k){const t=TT[k];if(!t)return'';
  return `<div class="cap">${esc(t.c)}</div><table>${t.r.map(r=>`<tr class="${r[2]===1?'pick':''}"><td>${esc(r[0])} 發</td><td>${esc(r[1])} 到</td><td class="grey">${r[2]===1?'本行程':r[2]?esc(r[2]):''}</td></tr>`).join('')}</table>${t.n?`<div class="grey" style="margin-top:6px">${esc(t.n)}</div>`:''}`}
function renderDay(i){
  cur=i;store.set('day',i);
  document.querySelectorAll('#dayBtns button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  const D=DAYS[i];let prev=D.start?P[D.start].q:null,pts=[],html='';
  D.items.forEach((it,k)=>{
    const pl=it.at?P[it.at]:null;let idx='';
    
    const nav=pl&&!it.nomove?`<a class="btn solid" target="_blank" rel="noopener" href="${gdir(prev,pl.q,it.m)}">🧭 導航</a>`:'';
    const pin='';
    const tt=it.tt?`<button class="btn" data-tt="d${i}i${k}">🕒 時刻表</button>`:'';
    const meta=(it.tr||it.g||it.c)?`<div class="meta">${it.tr?esc(it.tr):''}${it.g?` <span class="grey">${esc(it.g)}</span>`:''}${it.c?` <span class="grey">${esc(it.c)}</span>`:''}</div>`:'';
    html+=`<li class="${it.m?'move':''}"><div class="t">${it.t}</div><div><div class="n">${idx}${esc(it.n)}</div>${meta}${it.red?`<div class="red" style="font-size:13px">⚠️ ${esc(it.red)}</div>`:''}${(nav||pin||tt)?`<div class="acts">${nav}${pin}${tt}</div>`:''}${it.tt?`<div class="tt" id="d${i}i${k}">${ttHTML(it.tt)}</div>`:''}${it.w?`<div class="warn">⚠️ ${esc(it.w)}</div>`:''}</div></li>`;
    if(pl)prev=pl.q;
  });
  $('#dayBody').innerHTML=`<div class="dayhead"><div class="num">${i+1}</div><h2>${esc(D.title)}</h2></div><ol class="tl" style="margin-top:14px">${html}</ol>`;
  document.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.tt).classList.toggle('on'));
}
$('#dayBtns').innerHTML=DAYS.map((D,i)=>`<button aria-pressed="false">D${i+1}<br>${D.d} ${D.w}</button>`).join('');

  const L2=lists[sub],hasQ=sub!=='prep';
  $('#prepBody').innerHTML=L2.map((c,ci)=>`<div class="cat"><div class="cat-h">${esc(c.c)}<button class="x" data-dc="${ci}" aria-label="刪除分類">✕</button></div>
  <div class="items" data-cat="${ci}">${c.items.map((it,ii)=>`<div class="item ${it.d?'done':''}" data-ii="${ii}"><button class="handle" aria-label="拖曳排序">⋮⋮</button><button class="box" data-t="${ci}-${ii}" aria-label="${it.d?'取消勾選':'勾選'}">${it.d?'✓':''}</button><span class="txt">${esc(it.t)}</span>${hasQ?`<label class="qty">x<input inputmode="numeric" data-q="${ci}-${ii}" value="${esc(it.q||'')}" aria-label="數量">個</label>`:''}<button class="x" data-di="${ci}-${ii}" aria-label="刪除">✕</button></div>`).join('')}</div>
  <div class="add"><input placeholder="新增項目" data-in="${ci}"><button class="plus" data-ai="${ci}" aria-label="新增項目">＋</button></div></div>`).join('')+
  `<div class="add addcat" style="margin-top:18px"><input placeholder="新增分類" id="newCat"><button class="plus" id="addCat" aria-label="新增分類">＋</button></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const[a,z]=b.dataset.t.split('-');const it=L2[a].items[z];it.d=!it.d;save();renderList()});
  document.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{const[a,z]=i.dataset.q.split('-');L2[a].items[z].q=i.value;save()});
  document.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{const[a,z]=b.dataset.di.split('-');L2[a].items.splice(z,1);save();renderList()});
  document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{if(confirm('刪除「'+L2[b.dataset.dc].c+'」整個分類？')){L2.splice(b.dataset.dc,1);save();renderList()}});
  const addItem=ci=>{const inp=document.querySelector(`[data-in="${ci}"]`);const v=inp.value.trim();if(!v)return;L2[ci].items.push({t:v,d:false,q:''});save();renderList()};
  document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>addItem(b.dataset.ai));
  document.querySelectorAll('[data-in]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')addItem(i.dataset.in)});
  const addCat=()=>{const v=$('#newCat').value.trim();if(!v)return;L2.push({c:v,items:[]});save();renderList()};
  $('#addCat').onclick=addCat;$('#newCat').onkeydown=e=>{if(e.key==='Enter')addCat()};
  /* 拖曳排序（同分類內） */
  document.querySelectorAll('.handle').forEach(hd=>hd.onpointerdown=ev=>{
    ev.preventDefault();const row=hd.closest('.item'),box=row.parentElement;row.classList.add('drag');hd.setPointerCapture(ev.pointerId);
    const move=e=>{const sibs=[...box.children].filter(x=>x!==row);let placed=false;
      for(const s of sibs){const r=s.getBoundingClientRect();if(e.clientY<r.top+r.height/2){box.insertBefore(row,s);placed=true;break}}
      if(!placed)box.appendChild(row)};
    const up=()=>{hd.removeEventListener('pointermove',move);row.classList.remove('drag');
      const ci=box.dataset.cat,old=L2[ci].items;L2[ci].items=[...box.children].map(x=>old[x.dataset.ii]);save();renderList()};
    hd.addEventListener('pointermove',move);hd.addEventListener('pointerup',up,{once:true});hd.addEventListener('pointercancel',up,{once:true});
  });
}
renderList();
